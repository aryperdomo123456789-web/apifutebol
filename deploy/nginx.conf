# /www/server/panel/vhost/nginx/apifut.vr766.com.conf (aaPanel)
# Ajuste server_name e caminhos SSL conforme o painel.

upstream apifut_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limit global (por IP): 30 req/s com burst 60
limit_req_zone $binary_remote_addr zone=apifut_rl:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=apifut_cc:10m;

server {
    listen 80;
    server_name apifut.vr766.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name apifut.vr766.com;

    ssl_certificate     /www/server/panel/vhost/cert/apifut.vr766.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/apifut.vr766.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Segurança básica
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    # Painel admin: só a partir de IPs confiáveis
    location /v1/admin {
        # allow 203.0.113.10;   # <-- coloque seu IP aqui
        # deny all;
        proxy_pass http://apifut_backend;
        include /etc/nginx/proxy_params;
    }

    # Health público, sem rate limit
    location = /v1/health { proxy_pass http://apifut_backend; }

    location / {
        limit_req  zone=apifut_rl burst=60 nodelay;
        limit_conn apifut_cc 20;

        proxy_pass http://apifut_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    access_log /var/log/nginx/apifut.access.log;
    error_log  /var/log/nginx/apifut.error.log warn;
}
